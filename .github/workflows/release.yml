name: Release

# Raising the version in src-tauri/Cargo.toml and pushing to main builds the
# Windows installer, signs the update, and publishes Release v<version>.
# Installed copies of Studydesk pick it up through latest.json. Pushes that
# don't change the version do nothing. "Run workflow" on the Actions tab
# does the same by hand.
on:
  push:
    branches: [main]
    paths: ["src-tauri/Cargo.toml", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this version is already released
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
          git ls-remote --exit-code --tags origin "refs/tags/v$v" | Out-Null
          if ($LASTEXITCODE -eq 0) { "skip=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v already released" } else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Release notes
        id: notes
        shell: pwsh
        run: |
          $n = if (Test-Path RELEASE_NOTES.md) { Get-Content RELEASE_NOTES.md -Raw } else { "Improvements and fixes." }
          "body<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          $n.Trim() >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      - if: steps.ver.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.ver.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - if: steps.ver.outputs.skip == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Studydesk ${{ steps.ver.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json
